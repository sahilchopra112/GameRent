<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Favorites</title>
</head>
<body>
    <h1>Your Favorite Games</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Game ID</th>
                <th>Favorited At</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="favorite : ${favorites}">
                <td th:text="${favorite.gameId}"></td>
                <td th:text="${favorite.favoritedAt}"></td>
                <td>
                    <form th:action="@{/favorites/remove}" method="post">
                        <input type="hidden" th:name="gameId" th:value="${favorite.gameId}">
                        <button type="submit">Remove</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/home">Back to Home</a>
</body>
</html>
